<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://server.arcgisonline.com; connect-src 'self' https://api.github.com; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Japan in December</title>
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="head">
      <div class="head-row">
        <h1>Japan in <span>December</span></h1>
        <button class="icon-btn" id="device" aria-label="Device settings">Device</button>
      </div>
      <p id="sub">Trip planner</p>
      <div class="sync" id="sync" role="status" aria-live="polite"></div>
    </header>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-places" aria-selected="true" aria-controls="view">Places</button>
      <button class="tab" role="tab" id="tab-plan" aria-selected="false" aria-controls="view">Plan <span class="count" id="plan-count" data-zero>0</span></button>
    </div>
    <div class="scroll" id="view" role="tabpanel"></div>
  </aside>
  <div id="map" aria-label="Map of Japan"></div>
</div>
<script src="vendor/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
